name: BTC ETH CVD Collector

on:
  workflow_dispatch:
  schedule:
    - cron: '5 * * * *'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run CVD collector
        run: python cvd.py

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cvd_latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update CVD data"
            git push
          fi
